<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto</title>

<style>

    /* Fondo principal */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
    }

    /* Caja principal */
    .container {
        text-align: center;
        background: #1f2937;
        padding: 40px;
        border-radius: 20px;
        width: 320px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    /* Formularios */
    form {
        margin-bottom: 30px;
    }

    /* Inputs */
    input {
        width: 90%;
        margin: 8px 0;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #374151;
        color: white;
        outline: none;
    }

    /* Botones */
    button {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    /* Hover */
    button:hover {
        background: #6366f1;
    }

    /* Separador */
    hr {
        margin: 30px 0;
        border: 1px solid #374151;
    }

</style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <h1>Ingresar sesion</h1>

    <!--
        Flask enviara los datos
        a la ruta /login
    -->
    <form action="/login" method="POST">

        <label>Nombre:</label>
        <br>

        <input
            type="text"
            name="nombre"
            required
        >

        <br>

        <label>Contrasenia:</label>
        <br>

        <input
            type="password"
            name="contrasenia"
            required
        >

        <br>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>

</html>
